<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SwaggerUI" />
    <title>SwaggerUI</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
</head>

<body>
    <div style="background: #0f0f13; padding: 1rem; text-align: center;">
        <a href="index.html" style="color: #e0e0e0; font-family: sans-serif; text-decoration: none;">&larr; Back to
            Home</a>
    </div>
    <div id="swagger-ui"></div>
    <div
        style="background: #0f0f13; padding: 1rem; text-align: center; color: #e0e0e0; font-family: sans-serif; font-size: 0.8rem;">
        Created by <a href="https://x.com/TakashiSasaki" target="_blank"
            style="color:inherit; text-decoration:underline;">Takashi Sasaki</a>
    </div>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js" crossorigin></script>
    <script>
        window.onload = () => {
            window.ui = SwaggerUIBundle({
                url: '/openapi.json',
                dom_id: '#swagger-ui',
            });
        };
    </script>
</body>

</html>
